<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Shamba Fresh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="assets/images/shambafreshlogo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <a href="products.html" class="back-home">← Back to Products</a>
  <div class="split-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <h1>Complete<br>Order.</h1>
        <p>Choose how much you need and where to deliver it. You will pay on Pesapal's secure page with M-Pesa or card.</p>
      </div>
    </div>
    <div class="auth-right signup-mode">
      <div class="auth-form-container">
        <h2>Checkout</h2>
        <p class="subtitle" id="product-summary">Loading...</p>

        <form id="checkout-form">
          <div class="input-group">
            <label for="order-qty">Quantity (<span id="qty-unit">kg</span>)</label>
            <input type="number" id="order-qty" min="1" step="1" value="1" required>
            <small id="qty-error" class="feedback"></small>
            <small class="hint" id="qty-hint"></small>
          </div>
          
          <div class="order-total-row" style="background: var(--sage); border: 2px dashed var(--leaf); padding: 16px; border-radius: 8px; margin: 20px 0; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 1.1rem; font-weight: 600; color: var(--leaf);">Total to Pay:</span>
            <strong id="order-total" style="font-size: 1.8rem; color: var(--leaf); font-family: var(--head);">—</strong>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
            <small class="hint">Your payment receipt is sent here.</small>
          </div>
          <div class="input-group">
            <label for="location">Delivery Location</label>
            <input type="text" id="location" placeholder="e.g. Thika Road, Nairobi" required>
          </div>
          <button type="submit" class="btn main auth-submit" id="pay-btn">Continue to payment</button>
          <small id="checkout-msg" class="feedback" role="status" style="text-align:center; margin-top:10px;"></small>
        </form>
      </div>
    </div>
  </div>
  <script src="javascript/config.js"></script>
  <script src="javascript/order.js"></script>
</body>
</html>
