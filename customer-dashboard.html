<!DOCTYPE html>
<html lang="en">
<head>
  <!-- text encoding, so accents and symbols display correctly -->
  <meta charset="UTF-8">
  <!-- makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the text shown in the browser tab -->
  <title>My Orders | Shamba Fresh</title>
  
  <!-- opens the connection to Google Fonts early so the fonts load faster -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- the two fonts: Bricolage Grotesque for headings, Figtree for body text -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- the small icon in the browser tab -->
  <link rel="icon" type="image/jpeg" href="assets/images/shambafreshlogo.jpg">
  <!-- all the styling lives in this one file -->
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- dashboard layout: top bar, sidebar and main area -->
<body class="dash-body">

  <!-- slim top bar with the logo and the account menu -->
  <header class="dash-topbar">
    <a class="logo" href="index.html">
      <img src="assets/images/shambafreshlogo.jpg" alt="">
      <span>Shamba Fresh</span>
    </a>
    
    <div class="dash-topbar-right">
      <!-- 'Welcome, <name>': the script fills in the name -->
      <span class="dash-welcome">Welcome, <strong id="dash-username">customer</strong></span>
      
      <!-- avatar and menu, filled in by main.js -->
      <div id="nav-profile" class="profile-nav" style="display: none; margin-left: 10px;">
        <button class="profile-btn" id="profile-btn" aria-expanded="false">
          <span class="avatar" id="user-avatar">U</span>
        </button>
        <div class="profile-dropdown" id="profile-dropdown">
          <a href="profile.html">My Profile</a>
          <a href="#" class="logout-link" onclick="logout()">Log Out</a>
        </div>
      </div>
    </div>
  </header>

  <!-- sidebar on the left, content on the right -->
  <div class="dash-layout">
    <!-- Sidebar -->
    <!-- sidebar navigation -->
    <aside class="dash-sidebar">
      <button class="dash-tab active" data-tab="orders">📦 My Orders</button>
      
      <!-- Divider -->
      <!-- line separating the dashboard tab from the site links -->
      <div class="dash-sidebar-divider"></div>
      
      <!-- Site Navigation Links -->
      <a href="index.html" class="dash-tab external-link">🏠 Home</a>
      <a href="products.html" class="dash-tab external-link">🛍️ Marketplace</a>
      <a href="contact.html" class="dash-tab external-link">📞 Contact Us</a>
      <a href="profile.html" class="dash-tab external-link">⚙️ Account Settings</a>
    </aside>

    <!-- Main content -->
    <!-- the content area -->
    <main class="dash-main">
      <h1>My Orders</h1>
      <p class="subtitle">Track your purchases and delivery status.</p>

      <!-- messages such as 'Order #3 is confirmed' appear here -->
      <small id="orders-msg" class="feedback" role="status"></small>
      <!-- customer_dashboard.js draws the orders table here -->
      <div id="customer-orders" class="dash-table-wrap">
        <p class="empty-note">Loading your orders...</p>
      </div>
    </main>
  </div>

  <!-- scripts load in this order: settings first (config.js), then the shared header code (main.js), then this page's own code -->
  <script src="javascript/config.js"></script>
  <!-- shared header code: account menu and avatar -->
  <script src="javascript/main.js"></script>
  <!-- this page's own code: orders table and the Pay now / Check payment buttons -->
  <script src="javascript/customer-dashboard.js"></script>
</body>
</html>
