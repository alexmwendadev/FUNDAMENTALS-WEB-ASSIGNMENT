<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Shamba Fresh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="assets/images/shambafreshlogo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="split-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <h1>New<br>Password.</h1>
        <p>Choose a strong password to secure your account.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Set New Password</h2>
        <form id="reset-form">
          <div class="input-group">
            <label for="new-password">New Password</label>
            <div class="password-wrapper">
              <input type="password" id="new-password" placeholder="At least 8 characters" required minlength="8">
              <button type="button" class="toggle-password" id="toggle-reset-password" onclick="togglePassword('new-password', 'toggle-reset-password')"></button>
            </div>
          </div>
          <button type="submit" class="btn main auth-submit">Update Password</button>
          <small id="reset-msg" class="feedback" style="text-align: center; margin-top: 12px;"></small>
        </form>
      </div>
    </div>
  </div>
  <script src="javascript/config.js"></script>
  <script src="javascript/main.js"></script>
  <script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        alert("Invalid reset link.");
        window.location.href = 'login.html';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('new-password').value;
        const msg = document.getElementById('reset-msg');
        const btn = e.target.querySelector('button');

        setBtn(btn, 'Updating...');
        msg.className = 'feedback'; msg.style.display = 'none';

        try {
            const res = await fetch(`${API_BASE}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, new_password: password })
            });
            const data = await res.json();
            if (res.ok) {
                setBtn(btn, 'Success!');
                msg.textContent = 'Password updated! Redirecting to login...';
                msg.style.color = '#2c5a37';
                msg.style.display = 'block';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                showToast(errorMessage(data, 'Invalid or expired link.'));
                resetBtn(btn);
            }
        } catch {
            showToast('Cannot connect to backend.');
            resetBtn(btn);
        }
    });
  </script>
</body>
</html>
