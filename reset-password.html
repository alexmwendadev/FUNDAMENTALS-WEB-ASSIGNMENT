<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Shamba Fresh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="assets/images/shambafreshlogo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <a href="login.html" class="back-home">← Back to Login</a>
  <div class="split-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <h1>New<br>Password.</h1>
        <p>Choose a strong password to secure your account.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form-container">
        <h2>Set New Password</h2>
        
        <form id="reset-form">
          <div class="input-group">
            <label for="new-password">New Password</label>
            <div class="password-wrapper">
              <input type="password" id="new-password" placeholder="At least 8 characters" required minlength="8">
              <button type="button" class="toggle-password" id="toggle-reset-password" onclick="togglePassword('new-password', 'toggle-reset-password')"></button>
            </div>
            <!-- Live feedback for password strength -->
            <small id="password-feedback" class="feedback"></small>
            <small class="hint">Must have 8+ chars, uppercase, lowercase, number, and special character.</small>
          </div>
          <button type="submit" class="btn main auth-submit">Update Password</button>
        </form>
      </div>
    </div>
  </div>
  
  <script src="javascript/config.js"></script>
  <script src="javascript/main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        showToast("Invalid reset link.");
        setTimeout(() => window.location.href = 'login.html', 2000);
    }

    const passwordInput = document.getElementById('new-password');
    const passwordFeedback = document.getElementById('password-feedback');

    // Live password validation (Same as signup)
    passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        let missing = [];
        
        if (val.length < 8) missing.push("8+ characters");
        if (!/[A-Z]/.test(val)) missing.push("uppercase letter");
        if (!/[a-z]/.test(val)) missing.push("lowercase letter");
        if (!/\d/.test(val)) missing.push("number");
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(val)) missing.push("special character");

        if (missing.length === 0) {
            passwordFeedback.textContent = "Strong password!";
            passwordFeedback.className = "feedback success";
            passwordFeedback.style.display = "block";
        } else if (val.length > 0) {
            passwordFeedback.textContent = "Missing: " + missing.join(", ");
            passwordFeedback.className = "feedback error";
            passwordFeedback.style.display = "block";
        } else {
            passwordFeedback.textContent = "";
            passwordFeedback.style.display = "none";
        }
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        const btn = e.target.querySelector('button');

        // Final check before sending
        if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/\d/.test(password) || !/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
            passwordInput.dispatchEvent(new Event('input'));
            passwordInput.focus();
            return;
        }

        setBtn(btn, 'Updating...');

        try {
            const res = await fetch(`${API_BASE}/api/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, new_password: password })
            });
            
            if (res.ok) {
                setBtn(btn, 'Success! Redirecting...');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                const data = await res.json();
                showToast(errorMessage(data, 'Invalid or expired link.'));
                resetBtn(btn);
            }
        } catch {
            showToast('Cannot connect to backend.');
            resetBtn(btn);
        }
    });
  </script>
</body>
</html>
